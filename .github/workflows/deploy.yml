name: Build and deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      production:
        description: 'Publish to the live site instead of a preview URL'
        type: boolean
        default: false

permissions:
  contents: read

# Keyed per ref so a preview deploy on a feature branch cannot cancel a
# production deploy on master.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      # `biome ci` is the non-writing variant: it fails on anything `lint:fix`
      # would have changed, formatting and import order included.
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Pages calls a deployment "production" when --branch matches the project's
      # configured production branch, so a manual production run has to claim
      # `master` whatever branch the code actually came from. --commit-message
      # carries the real branch, keeping the deployments list honest.
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_BRANCH: ${{ (github.event_name == 'push' || inputs.production) && 'master' || github.ref_name }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=daynight-clock \
            --branch="$TARGET_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$SOURCE_BRANCH: $(git log -1 --pretty=%s)" \
            | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Report where it landed
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          TARGET: ${{ (github.event_name == 'push' || inputs.production) && 'production' || 'preview' }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Deployed \`$SOURCE_BRANCH\` as $TARGET"
            echo ""
            echo "- $URL"
            if [ "$TARGET" = production ]; then
              echo "- https://daynight-clock.azure.pp.ua"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
